name: Hot Wheels Stock Checker

on:
  schedule:
    # Every 15 minutes; 02:30 UTC is already included (08:00 IST).
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      health:
        description: 'Send a Telegram health report'
        required: false
        type: boolean
        default: false

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BLINKIT_LOCATION: ${{ secrets.BLINKIT_LOCATION }}
          ZEPTO_LOCATION: ${{ secrets.ZEPTO_LOCATION }}
          BLINKIT_SEARCH_URL: ${{ secrets.BLINKIT_SEARCH_URL }}
          ZEPTO_SEARCH_URL: ${{ secrets.ZEPTO_SEARCH_URL }}
          LOG_LEVEL: INFO
        run: |
          if [ "${{ inputs.health }}" = "true" ]; then
            python -m src.main --health
          else
            python -m src.main
          fi

      - name: Persist successful store state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update stock alert state [skip ci]"
            git push
          fi
