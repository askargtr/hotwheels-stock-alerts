name: Hot Wheels Stock Checker

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies automatically

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Stock Alert State Cache
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: alerts.json
          # Use run_id to ensure a cache miss on saving (since caches are immutable)
          key: stock-alerts-${{ github.run_id }}-${{ github.run_number }}
          # Restore the latest saved cache starting with 'stock-alerts-'
          restore-keys: |
            stock-alerts-

      - name: Run Stock Check Pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BLINKIT_LOCATION: ${{ secrets.BLINKIT_LOCATION }}
          ZEPTO_LOCATION: ${{ secrets.ZEPTO_LOCATION }}
          LOG_LEVEL: "INFO"
          SIMULATE_STORES: "false" # In production GitHub action, we try to run real queries
        run: |
          python src/main.py

      - name: Save Updated Stock Alert State Cache
        if: always() # Save even if check errors, to preserve partial updates/errors
        uses: actions/cache/save@v4
        with:
          path: alerts.json
          key: stock-alerts-${{ github.run_id }}-${{ github.run_number }}
