name: Hot Wheels Stock Checker

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
    # Run every morning at 08:00 AM IST (02:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub UI
    inputs:
      health:
        description: 'Run health check report'
        required: false
        type: boolean
        default: false

concurrency:
  group: stock-check
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies automatically

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Check Pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BLINKIT_LOCATION: ${{ secrets.BLINKIT_LOCATION }}
          ZEPTO_LOCATION: ${{ secrets.ZEPTO_LOCATION }}
          LOG_LEVEL: "INFO"
          SIMULATE_STORES: "false" # In production GitHub action, we try to run real queries
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ "${{ inputs.health }}" = "true" ]; then
            python src/main.py --health
          else
            python src/main.py
          fi

      - name: Commit and Push Changes
        if: always() # Save state changes even if some checks failed to protect state consistency
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add alerts.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update stock alert state [skip ci]"
            git push
          fi
